<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitCLI • Alışkanlık Takipçisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); }
        .streak-number { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <nav class="border-b border-slate-800 bg-slate-900">
        <div class="max-w-screen-xl mx-auto px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-calendar-check text-white text-2xl"></i>
                </div>
                <div>
                    <span class="font-display text-2xl font-semibold tracking-tighter">HabitCLI</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-mono">v0.2</span>
                </div>
            </div>
            <div class="flex items-center gap-x-3">
                <div class="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-2xl text-sm flex items-center gap-x-2">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="font-medium text-emerald-400">14 gün streak</span>
                </div>
                <div class="w-9 h-9 bg-slate-800 rounded-2xl overflow-hidden ring-2 ring-offset-2 ring-offset-slate-950 ring-slate-800">
                    <img src="https://i.pravatar.cc/36?img=28" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-xl mx-auto px-8 pt-8 pb-12">
        <div class="flex items-end justify-between mb-8">
            <div>
                <h1 class="font-display text-5xl tracking-tighter font-semibold mb-2">Alışkanlık Takipçisi</h1>
                <p class="text-slate-400">Her gün küçük adımlar, büyük değişim.</p>
            </div>
            <button onclick="showAddModal()" class="flex items-center gap-x-2.5 px-6 py-3.5 rounded-3xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 transition-all font-semibold text-sm shadow-inner">
                <i class="fa-solid fa-plus"></i>
                <span>Yeni Alışkanlık Ekle</span>
            </button>
        </div>

        <div class="grid grid-cols-12 gap-6">
            <!-- Today's Habits -->
            <div class="col-span-12 lg:col-span-7">
                <div class="glass border border-slate-800 rounded-3xl p-6">
                    <div class="flex items-center justify-between mb-5">
                        <div class="section-header text-emerald-400 flex items-center gap-x-2">
                            <i class="fa-solid fa-check-circle"></i>
                            <span>BUGÜN</span>
                        </div>
                        <div class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-2xl font-mono">12 Mayıs 2026</div>
                    </div>
                    <div id="today-list" class="space-y-2">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Streak Stats -->
            <div class="col-span-12 lg:col-span-5">
                <div class="glass border border-slate-800 rounded-3xl p-6 h-full">
                    <div class="section-header text-slate-400 mb-4">STREAK</div>
                    <div class="flex items-end gap-x-4">
                        <div>
                            <div id="current-streak" class="text-7xl font-semibold tabular-nums text-emerald-400 streak-number">14</div>
                            <div class="text-sm text-slate-400 -mt-1">gün</div>
                        </div>
                        <div class="pb-2">
                            <div class="flex items-center gap-x-1 text-emerald-400">
                                <i class="fa-solid fa-fire"></i>
                                <span class="font-semibold">En uzun: 37 gün</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6">
                        <div class="text-xs text-slate-400 mb-2">Bu hafta</div>
                        <div class="flex gap-x-1.5">
                            <div class="w-7 h-7 bg-emerald-500 rounded-xl flex items-center justify-center text-white text-xs"><i class="fa-solid fa-check"></i></div>
                            <div class="w-7 h-7 bg-emerald-500 rounded-xl flex items-center justify-center text-white text-xs"><i class="fa-solid fa-check"></i></div>
                            <div class="w-7 h-7 bg-emerald-500 rounded-xl flex items-center justify-center text-white text-xs"><i class="fa-solid fa-check"></i></div>
                            <div class="w-7 h-7 bg-emerald-500 rounded-xl flex items-center justify-center text-white text-xs"><i class="fa-solid fa-check"></i></div>
                            <div class="w-7 h-7 bg-emerald-500 rounded-xl flex items-center justify-center text-white text-xs"><i class="fa-solid fa-check"></i></div>
                            <div class="w-7 h-7 bg-slate-700 rounded-xl flex items-center justify-center text-[10px] text-slate-400">S</div>
                            <div class="w-7 h-7 bg-slate-700 rounded-xl flex items-center justify-center text-[10px] text-slate-400">P</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- All Habits -->
            <div class="col-span-12">
                <div class="glass border border-slate-800 rounded-3xl p-6">
                    <div class="flex items-center justify-between mb-5">
                        <div class="section-header text-slate-400">TÜM ALIŞKANLIKLAR</div>
                    </div>
                    <div id="all-habits" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        <!-- JS populated -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[200]">
        <div class="glass border border-slate-700 rounded-3xl w-full max-w-sm mx-4 p-6">
            <div class="font-semibold text-lg mb-4">Yeni Alışkanlık Ekle</div>
            <input id="habit-name" type="text" placeholder="Örn: Spor yapmak" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
            <div class="flex gap-x-3 mt-5">
                <button onclick="hideModal()" class="flex-1 py-3 rounded-2xl border border-slate-700 text-sm">İptal</button>
                <button onclick="addHabit()" class="flex-1 py-3 rounded-2xl bg-emerald-600 text-sm font-semibold">Ekle</button>
            </div>
        </div>
    </div>

    <script>
        let habits = [
            { name: "Spor", streak: 14, lastDone: "2026-05-11", total: 47 },
            { name: "Kitap oku", streak: 9, lastDone: "2026-05-11", total: 32 },
            { name: "Kod yaz", streak: 5, lastDone: "2026-05-10", total: 19 }
        ];

        function renderToday() {
            const container = document.getElementById('today-list');
            container.innerHTML = '';
            const today = '2026-05-11';
            habits.forEach((h, i) => {
                const done = h.lastDone === today;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between px-4 py-3 rounded-2xl border ${done ? 'bg-emerald-900/30 border-emerald-500/40' : 'bg-slate-900 border-slate-700'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-x-3">
                        <div class="w-9 h-9 rounded-2xl flex items-center justify-center ${done ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-400'}">
                            <i class="fa-solid fa-${done ? 'check' : 'circle'}"></i>
                        </div>
                        <div>
                            <div class="font-medium">${h.name}</div>
                            <div class="text-xs text-slate-500">${h.streak} gün streak</div>
                        </div>
                    </div>
                    <div>
                        ${done ? 
                            `<span class="px-3 py-1 text-xs bg-emerald-500/20 text-emerald-400 rounded-2xl font-medium">Yapıldı</span>` : 
                            `<button onclick="logHabit(${i})" class="px-4 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-medium">Yap</button>`
                        }
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderAll() {
            const container = document.getElementById('all-habits');
            container.innerHTML = '';
            habits.forEach((h, i) => {
                const div = document.createElement('div');
                div.className = 'p-4 bg-slate-900 border border-slate-700 rounded-2xl flex items-center justify-between';
                div.innerHTML = `
                    <div>
                        <div class="font-semibold">${h.name}</div>
                        <div class="text-xs text-slate-500 mt-0.5">${h.total} gün toplam • ${h.streak} gün streak</div>
                    </div>
                    <div class="text-right">
                        <div class="text-emerald-400 font-mono text-lg font-semibold">${h.streak}</div>
                        <div class="text-[10px] -mt-1 text-emerald-500">streak</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function logHabit(index) {
            const h = habits[index];
            const today = '2026-05-11';
            if (h.lastDone === today) return;
            h.lastDone = today;
            h.streak++;
            h.total++;
            renderToday();
            renderAll();
            const streakEl = document.getElementById('current-streak');
            streakEl.textContent = Math.max(...habits.map(x => x.streak));
            showToast(`✅ ${h.name} loglandı! Streak: ${h.streak} gün`);
        }

        function addHabit() {
            const name = document.getElementById('habit-name').value.trim();
            if (!name) return;
            habits.push({ name, streak: 0, lastDone: '', total: 0 });
            hideModal();
            renderToday();
            renderAll();
            showToast('Yeni alışkanlık eklendi');
            document.getElementById('habit-name').value = '';
        }

        function showAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
            setTimeout(() => document.getElementById('habit-name').focus(), 100);
        }

        function hideModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-modal').classList.remove('flex');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 px-6 py-3 rounded-2xl shadow-xl flex items-center gap-x-3 text-sm z-[300]';
            t.innerHTML = `<i class="fa-solid fa-check-circle text-emerald-400"></i> <span>${msg}</span>`;
            document.body.appendChild(t);
            setTimeout(() => { t.style.transition = 'all .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2200);
        }

        function init() {
            renderToday();
            renderAll();
            document.getElementById('current-streak').textContent = Math.max(...habits.map(h => h.streak));
        }
        init();
    </script>
</body>
</html>
